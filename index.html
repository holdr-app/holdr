<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--g:#FF7A1A;--gd:#D9600A;--b:#7A3E1D;--bd:#5A2A10;--o:#FF9600;--od:#E08600;--r:#FF4B4B;--p:#CE82FF;--y:#FFC800;
--bg:#FFFFFF;--tx:#2B1A0E;--mut:#8A8A8A;--line:#EEDFD3;--soft:#FBF4EE}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Nunito,system-ui,sans-serif;font-weight:700}
body{padding:0 0 calc(24px + env(safe-area-inset-bottom))}
.wrap{max-width:520px;margin:0 auto;padding:12px 16px}
h1{font-size:26px;font-weight:900;margin:8px 0 6px}
h2{font-size:20px;font-weight:900;margin:22px 0 10px}
h3{font-size:17px;font-weight:800;margin:0 0 2px}
p{margin:0}.mut{color:var(--mut);font-size:15px;line-height:1.45;font-weight:700}
.bull{width:100%;height:auto;display:block;border-radius:22%}
.tabs{display:flex;gap:4px;margin:0 -8px 8px;padding:4px;background:#fff;border:2px solid var(--line);border-radius:18px;position:sticky;top:6px;z-index:40}
.tabs button{flex:1;background:none;border:2px solid transparent;border-radius:14px;font:inherit;font-size:10px;font-weight:800;color:var(--mut);padding:4px 0;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.tabs button b{font-size:22px;line-height:1.15}
.tabs button.on{border-color:#FFB37A;background:#FFEBDD;color:var(--bd)}
.top{display:flex;justify-content:space-between;align-items:center;padding:4px 0 10px;font-weight:900;font-size:17px}
.top span{display:flex;align-items:center;gap:5px}
.btn{display:block;width:100%;border:2px solid transparent;border-radius:16px;padding:14px;font:inherit;font-weight:900;font-size:16px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;background:var(--g);color:#fff;box-shadow:0 4px 0 var(--gd)}
.btn:active{transform:translateY(4px);box-shadow:none}
.btn.blue{background:var(--b);box-shadow:0 4px 0 var(--bd)}
.btn.orange{background:var(--o);box-shadow:0 4px 0 var(--od)}
.btn.white{background:#fff;color:var(--b);border-color:var(--line);box-shadow:0 4px 0 var(--line)}
.btn.sm{padding:10px 14px;font-size:13px;width:auto;display:inline-block}
.card{border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;background:#fff}
.card.click{cursor:pointer;box-shadow:0 4px 0 var(--line)}
.card.click:active{transform:translateY(4px);box-shadow:none}
.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}
.ico{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:28px;flex:none;background:var(--soft)}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:900;background:var(--soft);color:var(--mut)}
.tag.g{background:#FFE2CC;color:var(--gd)}.tag.b{background:#FFEBDD;color:var(--bd)}.tag.o{background:#FFF0D5;color:var(--od)}
.bar{height:16px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--g);border-radius:99px;transition:width .6s;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.bar.o i{background:var(--o)}
nav-old{position:sticky;top:0;background:#fff;border-bottom:2px solid var(--line);display:flex;justify-content:space-around;padding:calc(6px + env(safe-area-inset-top)) 4px 6px;z-index:40;max-width:520px;margin:0 auto}
nav button{background:none;border:2px solid transparent;border-radius:14px;font:inherit;font-size:10px;font-weight:800;color:var(--mut);padding:4px 6px;display:flex;flex-direction:column;align-items:center;cursor:pointer}
nav button b{font-size:26px;line-height:1.1}
nav button.on{border-color:#FFB37A;background:#FFEBDD;color:var(--bd)}
/* tree hero */
.hero{border-radius:24px;background:linear-gradient(#FFEBDD,#FFF8F1);padding:12px 12px 16px;text-align:center;position:relative;overflow:hidden}
.hero svg{width:220px;height:220px;display:block;margin:0 auto}
.bubble{display:inline-block;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 14px;font-size:14px;margin-bottom:4px}
/* path */
.path{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0}
.node{width:70px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:26px;font-weight:900;color:#fff;background:var(--line);box-shadow:0 6px 0 #CFCFCF;cursor:pointer;position:relative}
.node.done{background:var(--y);box-shadow:0 6px 0 #E0A800}
.node.cur{background:var(--g);box-shadow:0 6px 0 var(--gd);animation:pulse 1.6s infinite}
.node.rest{background:#fff;border:3px dashed var(--line);box-shadow:none;font-size:22px}
@keyframes pulse{50%{transform:scale(1.07)}}
.wk{width:100%;background:var(--g);color:#fff;border-radius:16px;padding:12px 16px;box-shadow:0 4px 0 var(--gd)}
/* player */
#player{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));transition:background .4s}
#player.show{display:flex}
#player.sq{background:#FFF0D5}#player.rx{background:#F6ECE4}#player.pr{background:#FFF6EE}
.pbig{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.orb{width:min(70vw,260px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;transition:transform .7s cubic-bezier(.3,.8,.3,1),background .4s;box-shadow:0 10px 0 rgba(0,0,0,.08)}
.orb.sq{background:#E8590C;transform:scale(.72)}
.orb.rx{background:#8A4B26;transform:scale(1)}
.orb.pr{background:var(--b);transform:scale(.88)}
.orb b{font-size:72px;color:#fff;font-weight:900}
.word{font-size:40px;font-weight:900;letter-spacing:.02em}
.sq .word{color:#C2410C}.rx .word{color:#5A2A10}.pr .word{color:var(--bd)}
.sub{font-size:17px;color:var(--tx);max-width:320px;min-height:48px}
.x{background:none;border:0;font-size:26px;color:var(--mut);cursor:pointer;padding:0 8px 0 0}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:up .25s}
@keyframes pop{0%{transform:scale(0) rotate(-30deg)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes up{from{transform:translateY(60px)}}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--tx);color:#fff;padding:12px 18px;border-radius:14px;z-index:90;display:none;font-weight:800;text-align:center;max-width:90vw}
.steps li{margin:6px 0;line-height:1.4}
.seg{display:flex;gap:8px}.seg button{flex:1;border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 4px;font:inherit;font-weight:900;color:var(--mut);cursor:pointer}
.seg button.on{border-color:var(--b);background:#FFEBDD;color:var(--bd)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{border:2px solid var(--line);border-radius:16px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:900}.stat span{font-size:12px;color:var(--mut)}
.garden{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.garden div{border:2px solid var(--line);border-radius:16px;padding:6px;text-align:center;font-size:12px;color:var(--mut)}
.garden svg{width:100%;height:auto}
.ach div{border:2px solid var(--line);border-radius:16px;padding:10px 4px;text-align:center;font-size:11px;color:var(--mut)}
.ach .e{font-size:30px;display:block;filter:grayscale(1);opacity:.3}.ach .got{color:var(--tx);border-color:var(--y)}.ach .got .e{filter:none;opacity:1}
input{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px;font:inherit;font-size:16px;background:var(--soft)}
canvas#conf{position:fixed;inset:0;pointer-events:none;z-index:95}

function treeSVG(stage,kind,big){ // stage 0..7
 const T=TREES[kind]||TREES.oak;const g='#8B5A2B';let s=`<svg viewBox="0 0 200 200">`;
 s+=`<ellipse cx="100" cy="178" rx="70" ry="12" fill="#B9E58F"/><ellipse cx="100" cy="176" rx="34" ry="7" fill="#8B5A2B" opacity=".35"/>`;
 if(stage===0){s+=`<ellipse cx="100" cy="170" rx="9" ry="7" fill="#A0703A"/><path d="M100 164q2-6 6-7" stroke="#58CC02" stroke-width="3" fill="none" stroke-linecap="round"/>`}
 else if(stage===1){s+=`<path d="M100 176V150" stroke="#58CC02" stroke-width="5" stroke-linecap="round"/><ellipse cx="90" cy="148" rx="11" ry="6" fill="${T.c1}" transform="rotate(-25 90 148)"/><ellipse cx="110" cy="146" rx="11" ry="6" fill="${T.c1}" transform="rotate(25 110 146)"/>`}
 else{
  const h=[0,0,45,65,85,100,108,112][stage];const top=176-h;const tw=[0,0,6,8,11,13,14,15][stage];
  s+=`<path d="M${100-tw/2} 176 L${100-tw/3} ${top+10} L${100+tw/3} ${top+10} L${100+tw/2} 176Z" fill="${g}"/>`;
  const R=[0,0,22,32,42,52,56,58][stage];
  if(kind==='pine'){for(let i=0;i<3;i++){const y=top+i*R*.55-R*.3,w=R*(.55+i*.25);s+=`<path d="M100 ${y-R*.5} L${100-w} ${y+R*.45} L${100+w} ${y+R*.45}Z" fill="${i%2?T.c2:T.c1}"/>`}}
  else{s+=`<circle cx="100" cy="${top}" r="${R}" fill="${T.c2}"/><circle cx="${100-R*.55}" cy="${top+R*.25}" r="${R*.62}" fill="${T.c1}"/><circle cx="${100+R*.55}" cy="${top+R*.2}" r="${R*.65}" fill="${T.c1}"/><circle cx="100" cy="${top-R*.3}" r="${R*.7}" fill="${T.c1}"/><circle cx="${100-R*.3}" cy="${top-R*.45}" r="${R*.18}" fill="#fff" opacity=".35"/>`}
  if(stage>=6){const pts=[[-.5,-.2],[.4,-.4],[.1,.25],[-.2,-.6],[.6,.2],[-.6,.35]];pts.forEach(([x,y])=>s+=`<circle cx="${100+x*R}" cy="${top+y*R}" r="${stage===7?6:4.5}" fill="${stage===7?'#FF4B4B':'#FFFFFF'}" stroke="${stage===7?'#C62828':'#FFC800'}" stroke-width="2"/>`)}
 }
 return s+'</svg>';
}
const stageOf=(day,total)=>day<=0?0:Math.min(7,1+Math.floor(day/total*6.999));
const STAGE_N=['Семечко','Росток','Саженец','Молодое деревце','Деревце','Дерево','Цветёт','Плодоносит'];

/* =============== UI =============== */
const app=$('#app');let tab='home';
function go(t){tab=t;render();scrollTo(0,0)}
function nav(){}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e.t);e.t=setTimeout(()=>e.style.display='none',2500)}
function modal(h){$('#sheet').innerHTML=h;$('#modal').classList.add('show')}
function close_(){$('#modal').classList.remove('show')}
$('#modal').onclick=e=>{if(e.target.id==='modal')close_()};
const TABS=[['home','🌳','Главная'],['bonus','⭐','Бонусы'],['free','🛡️','Свобода'],['garden','🏡','Сад'],['me','👤','Профиль']];
const topbar=()=>`<div class="tabs">${TABS.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="go('${t[0]}')"><b>${t[1]}</b>${t[2]}</button>`).join('')}</div><div class="top"><span>🔥 ${S.streak}</span><span style="color:#1CB0F6">💎 ${S.gems}</span><span style="color:#FF9600">⚡ ${S.xp} XP</span><span>❄️ ${S.freeze}</span></div>`;
function applyTheme(){if(S.theme==='green'&&!S.themes.includes('bull')){S.themes.unshift('bull');S.theme='bull'}const t=THEMES[S.theme]||THEMES.bull;document.documentElement.style.setProperty('--g',t[1]);document.documentElement.style.setProperty('--gd',t[2])}
function render(){applyTheme();if(S.onb<9&&(S.camp||S.log.length||S.abs.porn.start)){S.onb=9;save()}if(S.onb<9&&S.camp){S.onb=9;save()}if(S.onb<9)return onb();({home,bonus,garden,me,free})[tab]()}

function campList(){return CAMPS.map(c=>`<div class="card click" onclick="campInfo('${c.id}')"><div class="row"><div class="ico">${c.e}</div><div style="flex:1"><h3>${c.t}</h3><p class="mut">${c.weeks} нед. · ${c.lvl}</p></div>${S.camp&&S.camp.id===c.id?'<span class="tag g">ИДЁТ</span>':(S.garden.filter(g=>g.c===c.id).length?'<span class="tag o">✓ ПРОЙДЕНА</span>':'')}</div></div>`).join('')}

/* ---- главная ---- */
function home(){
 if(!S.camp){app.innerHTML=topbar()+quoteCard()+`<div class="hero">${treeSVG(0,S.tree)}<div class="bubble">Посади новое дерево: выбери программу</div></div><h2>Основная программа</h2>${campList()}`;return}
 const c=CAMPS.find(x=>x.id===S.camp.id),total=c.weeks*PER_WEEK,day=S.camp.day,st=stageOf(day,total);
 const bl=campBlocks(c,day,S.camp.lvl),w=Math.floor(day/PER_WEEK);
 const ss=S.camp.sess||0;const dots=`<div style="display:flex;gap:8px;justify-content:center;margin:4px 0 12px">${SN.map((n,i)=>`<div style="flex:1;max-width:96px;border-radius:12px;padding:6px 0;font-size:12px;font-weight:900;${(mainToday()||i<ss)?'background:var(--g);color:#fff':i===ss?'background:#fff;border:2px solid var(--g);color:var(--gd)':'background:#E5E5E5;color:#AFAFAF'}">${(mainToday()||i<ss)?'✓':i+1} ${n}</div>`).join('')}</div>`;
 const msg=mainToday()?'День закрыт 💧 Следующий откроется завтра':['Полей меня, сделай тренировку 💧','Я жду тренировку!','Ещё чуть-чуть, и я подрасту 🌱'][day%3];
 let path='';for(let wi=0;wi<c.weeks;wi++){
  path+=`<div class="wk" style="${wi>w?'background:#E5E5E5;color:#8A8A8A;box-shadow:0 4px 0 #CFCFCF':''}"><b>НЕДЕЛЯ ${wi+1}</b><p style="font-size:13px;opacity:.9">${c.tasks?'📌 '+c.tasks[wi]:SESS+' × '+fmt(tsum(campBlocks(c,wi*PER_WEEK,S.camp.lvl)))+' в день'}</p></div>`;
  for(let i=0;i<=PER_WEEK;i++){const off=Math.sin((wi*7+i)*1.1)*60;
   if(i===PER_WEEK){path+=`<div class="node rest" style="transform:translateX(${off}px)">💤</div>`;continue}
   const di=wi*PER_WEEK+i;const cls=di<day?'done':di===day&&!mainToday()?'cur':'';
   path+=`<div class="node ${cls}" style="transform:translateX(${off}px)" onclick="${di===day?'runMain()':`toast('${di<day?'Пройдено ✓':'Откроется позже 🔒'}')`}">${di<day?'⭐':di===day?'▶':'🔒'}</div>`}}
 app.innerHTML=topbar()+quoteCard()+`
 <div class="hero">${treeSVG(st,S.camp.tree)}<div class="bubble">${msg}</div>
  <p class="mut" style="margin:6px 0">${STAGE_N[st]} · ${c.e} ${c.t} · день ${day+1} из ${total}</p>
  <div class="bar" style="margin:6px 8px 12px"><i style="width:${(day+ss/SESS)/total*100}%"></i></div>${dots}
  <div style="padding:0 6px">${mainToday()?`<button class="btn white" onclick="tab='bonus';nav();render()">⭐ Бонусная тренировка</button>`:`<button class="btn" onclick="runMain()">Тренировка ${ss+1} из ${SESS} · ${fmt(tsum(bl))}</button>`}</div></div>
 ${abMini()}<div class="card" style="margin-top:12px"><h3>Каждая тренировка дня (×${SESS})</h3><p class="mut" style="font-size:13px;margin-bottom:6px">Все ${SESS} обязательны. День засчитывается, когда сделаны все. Удобно: утром, днём и вечером.</p>${bl.map(b=>`<p class="mut">${EX[b[0]].e} ${EX[b[0]].n}: ${bdesc(b)}</p>`).join('')}</div>
 <h2>Твой путь</h2><div class="path">${path}<div class="node" style="background:#FFC800;box-shadow:0 6px 0 #E0A800;width:84px;height:76px;font-size:34px">🏆</div></div>`;
}
function bdesc([t,h,r,n,s]){s=s||1;const x=s>1?s+' подх. × ':'';
 if(t==='quick')return x+n+' раз';if(t==='ladder')return n+' раз';if(t==='relax')return n+' вдохов';return x+n+' раз по '+h+' сек'}
function quoteCard(){return `<div class="card" style="background:linear-gradient(135deg,#FFF4D6,#FFFFFF);border-color:#FFE08A"><p style="font-size:12px;color:#E08600;font-weight:900;letter-spacing:.05em">ФРАЗА ДНЯ</p><p style="font-size:17px;font-weight:800;margin-top:4px;line-height:1.4">«${quote()}»</p></div>`}
function abMini(){const on=Object.keys(AB).filter(k=>S.abs[k].start);if(!on.length)return `<div class="card click" style="margin-top:12px" onclick="tab='free';nav();render()"><div class="row"><div class="ico">🛡️</div><div style="flex:1"><h3>Трекер воздержания</h3><p class="mut">Без порно. Включи отсчёт</p></div><span class="mut">›</span></div></div>`;
 return `<div style="margin-top:12px">${on.map(k=>`<div class="card click" style="margin:0;text-align:center;border-color:${AB[k].c}" onclick="tab='free';nav();render()"><div style="font-size:24px">${AB[k].e}</div><b style="font-size:28px;color:${AB[k].c}">${abDays(S,k)}</b><p class="mut" style="font-size:12px">${plural(abDays(S,k),'день','дня','дней')} · ${AB[k].n.toLowerCase()}</p></div>`).join('')}</div>`}
function campInfo(id){
 const c=CAMPS.find(x=>x.id===id);const act=S.camp&&S.camp.id===id;let L=act?S.camp.lvl:S.lvl;
 modal(`<div style="text-align:center"><div style="font-size:52px">${c.e}</div><h1>${c.t}</h1><span class="tag b">${c.weeks} НЕДЕЛЬ · ${c.weeks*PER_WEEK} ТРЕНИРОВОК</span></div>
 <div class="card" style="margin-top:14px"><h3>🎯 Цель</h3><p class="mut">${c.goal}</p></div>
 <div class="card" style="border-color:#FFC800;background:#FFFBEA"><h3>🏆 Что получишь в конце</h3><p class="mut">${c.res}</p></div>
 <h3 style="margin:14px 0 6px">По неделям</h3>
 ${Array.from({length:c.weeks},(_,w)=>{const b=campBlocks(c,w*PER_WEEK,L);return `<div class="card" style="padding:12px"><b>Неделя ${w+1}</b> <span class="mut">· ${fmt(tsum(b))}</span>${b.map(x=>`<p class="mut" style="font-size:14px">${EX[x[0]].e} ${EX[x[0]].n}: ${bdesc(x)}</p>`).join('')}${c.tasks?`<p class="mut" style="font-size:14px">📌 ${c.tasks[w]}</p>`:''}</div>`}).join('')}
 <h3 style="margin:14px 0 6px">Сложность</h3><div class="seg" id="cl">${LV.map(l=>`<button data-l="${l.id}" class="${L===l.id?'on':''}">${l.n}</button>`).join('')}</div>
 <div style="display:grid;gap:12px;margin-top:18px">${act?`<button class="btn" onclick="close_();runMain()">Продолжить</button>`:`<button class="btn" onclick="startCamp('${id}')">${S.camp?'Заменить основную программу':'Сделать основной'}</button>`}<button class="btn white" onclick="close_()">Закрыть</button></div>
 ${S.camp&&!act?`<p class="mut" style="font-size:13px;margin-top:10px;text-align:center">Текущее дерево (${CAMPS.find(x=>x.id===S.camp.id).t}) засохнет, прогресс программы обнулится.</p>`:''}`);
 document.querySelectorAll('#cl button').forEach(b=>b.onclick=()=>{L=b.dataset.l;window._L=L;document.querySelectorAll('#cl button').forEach(x=>x.classList.toggle('on',x===b));if(act){S.camp.lvl=L;save();render();toast('Сложность: '+LV.find(l=>l.id===L).n)}});
 window._L=L;
}
function startCamp(id){S.camp={id,day:0,lvl:window._L||S.lvl,tree:S.tree};if(S.onb<9)S.onb=9;save();close_();tab='home';nav();render();toast('🌱 Семечко посажено!')}
function runMain(){if(mainToday())return toast('Сегодня день уже закрыт ✓ Следующий откроется завтра');const c=CAMPS.find(x=>x.id===S.camp.id);intro(campBlocks(c,S.camp.day,S.camp.lvl),c.t+' · день '+(S.camp.day+1)+' · '+SN[S.camp.sess||0].toLowerCase(),{main:1})}

/* ---- НАГРАДЫ ---- */
function lvlOf(xp){let l=1,need=200,acc=0;while(xp>=acc+need){acc+=need;l++;need=Math.round(need*1.2)}return{l,cur:xp-acc,need}}
const wkKey=d=>{d=new Date(d);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return dk(d)};
function metrics(s){const L=s.log;const byDay={};L.forEach(l=>byDay[l.d]=(byDay[l.d]||0)+1);
 const wkMain={},wkDays={};L.forEach(l=>{const k=wkKey(l.ts);if(l.dd){wkMain[k]=(wkMain[k]||0)+1}const dw=new Date(l.ts).getDay();(wkDays[k]=wkDays[k]||new Set()).add(dw)});
 return{best:s.best,n:L.length,min:L.reduce((a,l)=>a+l.sq,0)/60,sc:L.reduce((a,l)=>a+(l.sc||0),0),

}
function pAch(){const m=metrics(S);const cats=[...new Set(ACHS.map(a=>a[1]))];
 $('#pt').innerHTML=`<p class="mut" style="margin-bottom:6px">Открыто ${S.got.length} из ${ACHS.length}. Кристаллы, деревья, темы и титулы даются только здесь.</p>`+cats.map(c=>`<h2>${c}</h2>`+ACHS.filter(a=>a[1]===c).map(a=>{const got=S.got.includes(a[0]);const v=Math.min(a[6],Math.floor(a[5](m)));
 return `<div class="card" style="padding:12px;${got?'border-color:#FFC800;background:#FFFBEA':''}"><div class="row"><div class="ico" style="${got?'':'filter:grayscale(1);opacity:.45'}">${a[2]}</div><div style="flex:1"><h3>${a[3]}</h3><p class="mut" style="font-size:13px">${a[4]}</p>${got?'':`<div class="bar" style="height:10px;margin-top:6px"><i style="width:${v/a[6]*100}%;background:#FFC800"></i></div><p class="mut" style="font-size:11px;margin-top:2px">${v} / ${a[6]}</p>`}<p style="font-size:12px;margin-top:4px;color:${got?'#E08600':'#AFAFAF'}">${rewardText(a[7]).join(' · ')}</p></div>${got?'<span style="font-size:22px">✅</span>':''}</div></div>`}).join('')).join('')}
function pInv(){
 $('#pt').innerHTML=`<h2 style="margin-top:0">🎖️ Титулы</h2><div style="display:flex;flex-wrap:wrap;gap:8px">${S.titles.map(t=>`<button class="seg" style="display:inline-block;border:2px solid ${S.title===t?'#1CB0F6':'#E5E5E5'};background:${S.title===t?'#FFEBDD':'#fff'};border-radius:14px;padding:10px 14px;font:inherit;font-weight:900;cursor:pointer" onclick="S.title='${t}';save();me()">${t}</button>`).join('')}</div>
 <h2>🎨 Темы</h2><div class="grid3">${Object.entries(THEMES).map(([k,t])=>{const own=S.themes.includes(k);return `<div class="stat" style="cursor:pointer;${S.theme===k?'border-color:#1CB0F6':''};${own?'':'opacity:.4'}" onclick="${own?`S.theme='${k}';save();render()`:`toast('Открывается за достижение')`}"><div style="height:34px;border-radius:10px;background:${t[1]};box-shadow:0 4px 0 ${t[2]};margin-bottom:8px"></div><span>${own?t[0]:'🔒 '+t[0]}</span></div>`}).join('')}</div>
 <h2>💌 Письма</h2>${S.letters.length?S.letters.map(l=>`<div class="card click" onclick="showLetter('${l.id}')"><div class="row"><div class="ico">💌</div><div style="flex:1"><h3>${LET[l.id][0]}</h3><p class="mut" style="font-size:13px">${l.d}</p></div>${l.read?'':'<span class="tag o">НОВОЕ</span>'}</div></div>`).join(''):'<p class="mut">Письма приходят за важные моменты на пути.</p>'}`;}
function showLetter(id){const x=S.letters.find(l=>l.id===id);x.read=1;save();modal(`<div style="text-align:center;font-size:60px">💌</div><h1>${LET[id][0]}</h1><p class="mut" style="font-size:16px;line-height:1.6">${LET[id][1]}</p><button class="btn" style="margin-top:18px" onclick="close_();me()">Спасибо</button>`)}
function pSet(){
 $('#pt').innerHTML=`
 <div class="card"><h3>Сложность бонусов</h3><div class="seg" id="lv" style="margin-top:8px">${LV.map(l=>`<button data-l="${l.id}" class="${S.lvl===l.id?'on':''}">${l.n}</button>`).join('')}</div></div>
 <div class="card"><div class="row between"><h3>Звук сигналов</h3><div class="seg" style="width:150px"><button id="s1" class="${S.sound?'on':''}">Вкл</button><button id="s0" class="${S.sound?'':'on'}">Выкл</button></div></div></div>
 <div class="card"><h3>Напоминание</h3><input type="time" id="rem" value="${S.rem}" style="margin:8px 0"><button class="btn white" onclick="remHelp()">Как включить на iPhone</button></div>
 <div class="card"><h3>Перенос прогресса</h3><p class="mut" style="margin-bottom:8px">Данные хранятся только на этом телефоне.</p><div class="grid2"><button class="btn white sm" style="width:100%" onclick="expo()">Копировать</button><button class="btn white sm" style="width:100%" onclick="impo()">Вставить</button></div></div>
 <div class="card"><p class="mut">⚠️ Боль или дискомфорт: остановись и сходи к урологу. Если за 2–3 месяца нет результата, тоже к врачу.</p></div>
 <button class="btn white" style="color:#FF4B4B" onclick="askReset()">Сбросить данные</button>`;
 document.querySelectorAll('#lv button').forEach(b=>b.onclick=()=>{S.lvl=b.dataset.l;save();me()});
 $('#s1').onclick=()=>{S.sound=1;save();me()};$('#s0').onclick=()=>{S.sound=0;save();me()};$('#rem').onchange=e=>{S.rem=e.target.value;save()};
}
function askReset(){modal(`<h2>Сбросить всё?</h2><p class="mut">Сад, кристаллы и прогресс удалятся.</p><div class="grid2" style="margin-top:14px"><button class="btn white" onclick="close_()">Отмена</button><button class="btn" style="background:#FF4B4B;box-shadow:0 4px 0 #C62828" onclick="S=def();save();close_();tab='home';render()">Сбросить</button></div>`)}
function remHelp(){modal(`<h1>Напоминание на iPhone</h1><div class="card"><h3>Через «Команды»</h3><ol class="steps mut"><li>Открой «Команды» → вкладка «Автоматизация» → «+».</li><li>«Время суток» → ${S.rem} → «Ежедневно» → «Запускать сразу».</li><li>Действие «Показать уведомление»: «Holdr 🌳 полей дерево».</li><li>Можно добавить «Открыть URL» со ссылкой на приложение.</li></ol></div><div class="card"><h3>Или «Напоминания»</h3><p class="mut">Новое напоминание «Holdr», ${S.rem}, повтор «Ежедневно».</p></div><button class="btn" onclick="close_()">Готово</button>`)}
function expo(){const t=btoa(unescape(encodeURIComponent(JSON.stringify(S))));(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Скопировано')).catch(()=>modal(`<textarea style="width:100%;height:120px">${t}</textarea><button class="btn" onclick="close_()">Закрыть</button>`))}
function impo(){modal(`<h2>Вставь код</h2><textarea id="it" style="width:100%;height:120px"></textarea><button class="btn" style="margin-top:10px" onclick="try{S=Object.assign(def(),JSON.parse(decodeURIComponent(escape(atob($('#it').value.trim())))));save();close_();render();toast('Готово')}catch(e){toast('Неверный код')}">Восстановить</button>`)}

/* =============== ПЛЕЕР =============== */
function intro(blocks,name,opt){
 const types=[...new Set(blocks.map(b=>b[0]))];
 modal(`<h1>${name}</h1><p class="mut" style="margin-bottom:12px">${fmt(tsum(blocks))} · следи за командами на экране</p>
 <div class="grid2" style="margin-bottom:12px"><div class="card" style="margin:0;background:#FFF8EC;border-color:#FFC56B;text-align:center"><b style="color:#E08600">🟠 НАПРЯГИ</b><p class="mut" style="font-size:13px">сожми и держи</p></div><div class="card" style="margin:0;background:#F7EEE7;border-color:#D9B79C;text-align:center"><b style="color:#7A3E1D">🟤 РАССЛАБЬ</b><p class="mut" style="font-size:13px">полностью отпусти</p></div></div>
 ${types.map(t=>`<div class="card" style="padding:12px"><div class="row"><div class="ico" style="width:44px;height:44px;font-size:22px">${EX[t].e}</div><div><h3>${EX[t].n}</h3><p class="mut" style="font-size:14px">${EX[t].short}</p></div></div></div>`).join('')}
 <button class="btn" id="go">Начать</button>`);
 $('#go').onclick=()=>{close_();run(blocks,name,opt)};
}
let P=null,AC=null;
function beep(f){if(!S.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.18,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.15);o.start();o.stop(AC.currentTime+.15)}catch(e){}}
function run(blocks,name,opt){const st=steps(blocks);P={st,i:0,left:st[0].d,t0:performance.now(),pause:0,el:0,tot:st.reduce((a,s)=>a+s.d,0),name,opt,sq:sqTime(st),blocks};
 try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}
 $('#player').classList.add('show');$('#pPause').textContent='Пауза';show();tick()}
function show(){const s=P.st[P.i];$('#player').className='show '+s.k;$('#pOrb').className='orb '+s.k;$('#pWord').textContent=s.w;$('#pSub').textContent=s.sub||'';$('#pRep').textContent=s.rep?'Повтор '+s.rep:'';$('#pBlk').textContent=s.tag;beep(s.k==='sq'?880:s.k==='rx'?520:660)}
function tick(){if(!P)return;const now=performance.now();if(!P.pause){const dt=(now-P.t0)/1000;P.left-=dt;P.el+=dt;if(P.left<=0){P.i++;if(P.i>=P.st.length)return done();P.left=P.st[P.i].d;show()}$('#pNum').textContent=Math.ceil(P.left);$('#pBar').style.width=Math.min(100,P.el/P.tot*100)+'%'}P.t0=now;requestAnimationFrame(tick)}
$('#pPause').onclick=()=>{P.pause=!P.pause;$('#pPause').textContent=P.pause?'Продолжить':'Пауза'};
$('#pSkip').onclick=()=>{P.el+=P.left;P.left=0};
$('#pX').onclick=()=>{if(P.el/P.tot>.75)return done();P=null;$('#player').classList.remove('show');toast('Тренировка не засчитана')};

function done(){
 const p=P;P=null;$('#player').classList.remove('show');
 const first=!anyToday();let xp=p.sq+20,gem=0,msg='',grew='';const lastD=S.log.length?new Date(S.log[S.log.length-1].ts):null;const gap=lastD?Math.floor((Date.now()-lastD)/864e5):0;const lvBefore=lvlOf(S.xp).l;
 if(first){if(S.last===ago(1))S.streak++;else if(S.last===ago(2)&&S.freeze>0){S.freeze--;S.streak++;msg+='❄️ Заморозка спасла серию!<br>'}else if(S.last!==dk())S.streak=1;S.last=dk();S.best=Math.max(S.best,S.streak);if(S.streak%7===0&&S.freeze<3){S.freeze++;msg+='❄️ +1 заморозка за неделю серии!<br>'}xp+=Math.min(50,S.streak*5)}
 const lvl=p.opt.main?S.camp.lvl:S.lvl;
 let dayDone=false;if(p.opt.main&&!mainToday()&&(S.camp.sess=(S.camp.sess||0)+1)<SESS){msg+=`💧 Тренировка ${S.camp.sess} из ${SESS} сделана. Осталось ${SESS-S.camp.sess}, и день засчитается.<br>`}
 else if(p.opt.main&&!mainToday()){dayDone=true;S.camp.sess=0;S.camp.dd=dk();const c=CAMPS.find(x=>x.id===S.camp.id),total=c.weeks*PER_WEEK;const before=stageOf(S.camp.day,total);S.camp.day++;msg+='✅ День закрыт! Следующий откроется завтра.<br>';const after=stageOf(S.camp.day,total);if(after>before)grew=STAGE_N[after];
  if(S.camp.day>=total){xp+=300;S.garden.push({c:c.id,tree:S.camp.tree,d:new Date().toLocaleDateString('ru-RU')});msg+=`🏆 Программа «${c.t}» пройдена!<br>${c.res}<br>Дерево ушло в сад.<br>`;S.camp=null}
  else if(S.camp.day%PER_WEEK===0)msg+='🎉 Неделя закрыта! Завтра отдых, потом нагрузка подрастёт.<br>'}
 if(p.opt.bonus){const u=S.bonusDay[dk()]=S.bonusDay[dk()]||[];if(!u.includes(p.opt.bonus)){u.push(p.opt.bonus);xp+=p.opt.gem*2}}
 S.xp+=xp;S.gems+=gem;S.log.push({d:dk(),ts:Date.now(),n:p.name,sq:p.sq,sc:sqCount(p.st),hm:hMax(p.st),main:!!p.opt.main,dd:dayDone,b:p.opt.bonus,lvl,gap});
 const k=Object.keys(S.bonusDay);if(k.length>14)delete S.bonusDay[k[0]];
 checkWeek();const newA=checkAch();if(lvlOf(S.xp).l>lvBefore)msg+=`⚡ Новый уровень ${lvlOf(S.xp).l}!<br>`;window._rq=newA;save();confetti();
 const tr=S.camp?S.camp.tree:S.tree,st=S.camp?stageOf(S.camp.day,CAMPS.find(x=>x.id===S.camp.id).weeks*PER_WEEK):7;
 modal(`<div style="text-align:center">${p.opt.main?treeSVG(st,tr):`<div style="width:120px;margin:0 auto">${BULL}</div>`}<h1>${grew?'Дерево выросло! '+grew:'Отлично!'}</h1>
 <div class="grid3" style="margin:14px 0"><div class="stat" style="border-color:#FFC56B"><b style="color:#FF9600">+${xp}</b><span>XP</span></div><div class="stat" style="border-color:#FFB37A"><b style="color:#1CB0F6">${newA.length?'🎁 '+newA.length:'—'}</b><span>наград</span></div><div class="stat"><b>🔥 ${S.streak}</b><span>серия</span></div></div>
 ${msg?`<div class="card" style="text-align:left;background:#FFFBEA;border-color:#FFC800"><p>${msg}</p></div>`:''}
 <p class="mut" style="margin-bottom:10px">Как было?</p><div class="grid3"><button class="btn white sm" style="width:100%" onclick="feel(-1)">😮‍💨 Тяжело</button><button class="btn white sm" style="width:100%" onclick="feel(0)">👌 Норм</button><button class="btn white sm" style="width:100%" onclick="feel(1)">😎 Легко</button></div></div>`);
 render();
}
function feel(v){close_();setTimeout(nextReward,350);S.fb=(S.fb||[]).concat(v).slice(-3);save();
 if(S.fb.length===3&&v&&S.fb.every(x=>x===v)){const cur=S.camp?S.camp.lvl:S.lvl,i=LV.findIndex(l=>l.id===cur)+v;if(i>=0&&i<3)modal(`<h2>${v>0?'Слишком легко? 😎':'Тяжеловато? 😮‍💨'}</h2><p class="mut">Три раза подряд «${v>0?'легко':'тяжело'}». Переключить на «${LV[i].n}»?</p><div class="grid2" style="margin-top:14px"><button class="btn white" onclick="close_()">Нет</button><button class="btn" onclick="if(S.camp)S.camp.lvl='${LV[i].id}';S.lvl='${LV[i].id}';S.fb=[];save();close_();render();toast('Сложность: ${LV[i].n}')">Да</button></div>`)}}

function confetti(){const c=$('#conf'),x=c.getContext&&c.getContext('2d');if(!x)return;c.width=innerWidth;c.height=innerHeight;const cl=['#58CC02','#1CB0F6','#FF9600','#FFC800','#CE82FF'];const ps=Array.from({length:100},()=>({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*13,vy:-Math.random()*13-3,s:Math.random()*7+5,c:cl[Math.random()*5|0],r:Math.random()*6}));let f=0;(function a(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.r+=.12;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);x.restore()});if(++f<120)requestAnimationFrame(a);else x.clearRect(0,0,c.width,c.height)})()}

setTimeout(()=>{if(S.onb>=9){window._rq=checkAch();if(window._rq.length){save();nextReward()}}},600);
if(S.last&&S.last!==dk()&&S.last!==ago(1)&&!(S.last===ago(2)&&S.freeze>0)){S.streak=0;save()}
render();
</script>
